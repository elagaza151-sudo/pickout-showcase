<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PICK & OUT Showcase | لوحة المدير</title>
<style>
:root{color-scheme:dark;font-family:Tahoma,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f8eedb;background:radial-gradient(circle at 80% 0%,#54321d 0,transparent 40%),linear-gradient(145deg,#1b110c,#301b12 65%,#140d0a)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px max(18px,calc((100vw - 1100px)/2));border-bottom:1px solid #ffffff20;background:#21140ec9}header strong{font-size:22px;letter-spacing:.5px}header strong span{color:#30c67b}a{color:#e7c188;text-decoration:none}main{max-width:1100px;margin:38px auto;padding:0 18px}h1{font-size:clamp(24px,4vw,34px);margin:0 0 12px}h2{font-size:21px;margin:0 0 18px}p{color:#d5c3b0;line-height:1.7}.panel{background:#2c1d16e8;border:1px solid #a8784b6b;border-radius:20px;padding:24px;margin:20px 0;box-shadow:0 16px 35px #0004}.login{max-width:440px;margin:65px auto}label{display:block;margin:12px 0;color:#f1dfc8}input:not([type=checkbox]){width:100%;min-width:0;padding:12px 13px;border:1px solid #8c6b50;background:#1a100c;color:white;border-radius:10px;font:inherit}input:focus{outline:2px solid #32c47c;outline-offset:1px}button{background:#168a53;color:#fff;border:0;border-radius:10px;padding:12px 17px;font:inherit;font-weight:bold;cursor:pointer}button:hover{filter:brightness(1.12)}button.danger{background:#8c3530}button.secondary{background:#6c4c35}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:630px}th,td{text-align:right;padding:11px 9px;border-bottom:1px solid #ffffff20}th{color:#e3b887}td input{font-size:14px!important}.game-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.game-grid label{padding:12px;background:#3c281c;border-radius:12px;margin:0}.game-grid input{accent-color:#1eaf69}#status,#loginError{min-height:25px;color:#f0c588}[hidden]{display:none!important}@media(max-width:650px){header{padding:16px}main{margin:20px auto}.panel{padding:17px}.actions button{flex:1}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./showcase-config.js"></script></head>
<body><header><strong>PICK <span>&amp;</span> OUT <small style="font-size:12px;color:#dfbd91">SHOWCASE</small></strong><a href="./index.html">العودة للموقع</a></header>
<main><section id="loginPanel" class="panel login"><h1>دخول المدير</h1><p>سجّل الدخول لإدارة نسخة Showcase المستقلة.</p><label for="username">اسم المستخدم</label><input id="username" autocomplete="username" placeholder="admin"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور"><div class="actions"><button id="login" type="button">تسجيل الدخول</button></div><p id="loginError" role="alert"></p></section>
<section id="adminPanel" hidden><h1>لوحة إدارة Showcase</h1><p>إدارة المنيو والألعاب الخاصة بالنسخة التجريبية فقط.</p><div class="actions"><button id="add" type="button">+ إضافة صنف</button><button id="save" type="button">حفظ التعديلات</button><button id="export" type="button" class="secondary">تصدير JSON</button><button id="reset" type="button" class="danger">حذف جماعي</button><label style="display:inline-flex;align-items:center;gap:8px">استيراد <input id="import" type="file" accept=".json,application/json" style="max-width:230px"></label></div><p id="status" role="status"></p>
<section class="panel"><h2>إدارة المنتجات</h2><div class="table-wrap"><table><thead><tr><th>القسم</th><th>الاسم</th><th>السعر (جنيه)</th><th>إجراء</th></tr></thead><tbody id="products"></tbody></table></div></section>
<section class="panel"><h2>تشغيل وإيقاف الألعاب</h2><div class="game-grid" id="games"></div></section></section></main>
<script>const db=window.supabase.createClient(window.SHOWCASE_SUPABASE_URL,window.SHOWCASE_SUPABASE_PUBLISHABLE_KEY,{auth:{storageKey:'pickout-showcase-admin-v1'}});let products=[],games=[];const $=id=>document.getElementById(id);const status=$('status');const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function authCheck(){const {data:{user}}=await db.auth.getUser();if(!user){$('adminPanel').hidden=true;$('loginPanel').hidden=false;return}const {data,error}=await db.from('showcase_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){await db.auth.signOut();$('loginError').textContent='الحساب مش مخوّل كمدير للنسخة دي';return}$('loginPanel').hidden=true;$('adminPanel').hidden=false;await load()}$('login').onclick=async()=>{try{const {error}=await db.auth.signInWithPassword({email:(function(){const u=$('username').value.trim().toLowerCase();if(!/^[a-z0-9_]{3,32}$/.test(u))throw new Error('اسم المستخدم لازم يكون 3–32 حرف إنجليزي صغير أو رقم أو _');return u+'@login.pickout-showcase.invalid'})(),password:$('password').value});if(error){$('loginError').textContent='تعذر تسجيل الدخول: '+error.message;return}await authCheck()}catch(e){$('loginError').textContent=e.message||'تعذر تسجيل الدخول'}};async function load(){const [p,g]=await Promise.all([db.from('showcase_products').select('*').order('sort_order'),db.from('showcase_games').select('*').order('sort_order')]);if(p.error||g.error){status.textContent='فشل تحميل البيانات';return}products=p.data;games=g.data;render()}function render(){$('products').innerHTML=products.map((p,i)=>'<tr><td><input data-i="'+i+'" data-field="category" value="'+escapeHtml(p.category)+'"></td><td><input data-i="'+i+'" data-field="name" value="'+escapeHtml(p.name)+'"></td><td><input type="number" min="0" step="0.5" data-i="'+i+'" data-field="price" value="'+Number(p.price)+'"></td><td><button class="danger" data-remove="'+i+'">حذف</button></td></tr>').join('');$('games').innerHTML=games.map(g=>'<label><input type="checkbox" data-game="'+escapeHtml(g.id)+'" '+(g.is_active?'checked':'')+'> '+escapeHtml(g.title)+'</label>').join('')}function setStatus(t){status.textContent=t}$('products').addEventListener('input',e=>{const t=e.target;if(t.dataset.field){const p=products[Number(t.dataset.i)];p[t.dataset.field]=t.dataset.field==='price'?Number(t.value):t.value;p._dirty=true}});$('products').addEventListener('click',async e=>{const i=e.target.dataset.remove;if(i===undefined)return;const p=products[Number(i)];if(!confirm('تحذف '+p.name+'؟'))return;if(p.id){const {error}=await db.from('showcase_products').delete().eq('id',p.id);if(error){setStatus(error.message);return}}products.splice(Number(i),1);render();setStatus('تم حذف الصنف')});$('add').onclick=()=>{products.push({category:'مشروبات ساخنة',name:'صنف جديد',price:0,sort_order:products.length+1,_dirty:true});render()};$('save').onclick=async()=>{setStatus('جاري الحفظ...');for(const p of products.filter(p=>p._dirty)){if(!p.name.trim()||!p.category.trim()||!Number.isFinite(Number(p.price))||p.price<0){setStatus('راجع الاسم والقسم والسعر');return}const payload={category:p.category,name:p.name,price:Number(p.price),sort_order:p.sort_order||0,is_active:p.is_active!==false};const query=p.id?db.from('showcase_products').update(payload).eq('id',p.id):db.from('showcase_products').insert(payload);const {error}=await query;if(error){setStatus('فشل الحفظ: '+error.message);return}}for(const g of games.filter(g=>g._dirty)){const {error}=await db.from('showcase_games').update({is_active:g.is_active}).eq('id',g.id);if(error){setStatus(error.message);return}}setStatus('تم حفظ التعديلات في قاعدة بيانات Showcase');await load()};$('games').addEventListener('change',e=>{const g=games.find(g=>g.id===e.target.dataset.game);if(g){g.is_active=e.target.checked;g._dirty=true}});$('export').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({products,games},null,2)],{type:'application/json'}));a.href=u;a.download='showcase-export.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('reset').onclick=()=>setStatus('الحذف الجماعي معطّل لحماية البيانات. احذف صنف واحد في كل مرة.');$('import').onchange=()=>setStatus('الاستيراد المباشر معطّل لحماية البيانات؛ استخدم إضافة صنف.');authCheck();</script></body></html>
