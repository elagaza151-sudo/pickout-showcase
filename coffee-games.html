<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PICK & OUT | Games</title><style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#fff5e9;background:#21140f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#70452b80,transparent 55%),repeating-linear-gradient(0deg,#331c15 0 37px,#1c100c 38px 41px)}header,main{max-width:960px;margin:auto;padding:18px}header{display:flex;gap:12px;justify-content:space-between;align-items:center}a{color:#ffdb9a}button,.btn{border:1px solid #d9a86b;border-radius:13px;background:#4c2c1b;color:#fff3dd;padding:12px 17px;cursor:pointer;font-weight:700;text-decoration:none}button:hover,.btn:hover{background:#74472b}button:disabled{opacity:.5;cursor:default}.glass{background:#21170edc;border:1px solid #b7804d75;box-shadow:0 12px 40px #0007;border-radius:22px;padding:20px;margin:18px 0}h1{font-size:clamp(26px,5vw,44px);margin:10px 0}h2{font-size:23px}p{line-height:1.6}.muted{color:#e0c5a5}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#5a3523;border-radius:12px;padding:10px 16px}.arena{position:relative;min-height:330px;border-radius:18px;background:linear-gradient(135deg,#69432d,#302018);overflow:hidden;display:grid;place-items:center;padding:15px}.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.tiles button{font-size:28px;min-width:70px}.cup{width:110px;height:72px;border:5px solid #f5dfbf;border-radius:10px 10px 32px 32px;background:linear-gradient(#b98555,#51301d);box-shadow:inset 0 12px #e5c09c;display:grid;place-items:center;font-size:32px}.tower{display:flex;flex-direction:column-reverse;align-items:center;gap:2px}.tower .cup{height:37px;width:90px;font-size:19px}.fall{position:absolute;font-size:36px;touch-action:none;user-select:none}.basket{position:absolute;bottom:12px;font-size:55px;transition:left .07s linear}.orders{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.order{border:1px solid #c89a64;background:#382318;border-radius:12px;padding:13px;min-width:145px}.order strong{display:block;margin-bottom:8px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1}#awardMsg{min-height:20px}@media(max-width:600px){header{flex-wrap:wrap}.glass{padding:14px}.arena{min-height:290px}.tiles button{min-width:60px;padding:10px}.order{min-width:120px}}</style></head><body><header><a href="./index.html#games" id="back">↩ الرجوع للألعاب</a><a href="./arcade.html" id="rank">🏆 ترتيب المسابقة</a><button id="lang">English</button></header><main><h1 id="heading"></h1><p class="muted" id="description"></p><section class="glass"><div class="stats"><div class="stat" id="score">⭐ 0</div><div class="stat" id="time">⏱ 0</div><div class="stat" id="lives">❤️ 3</div></div><p id="instruction"></p><div class="arena" id="arena"></div><div class="actions"><button id="start">▶ ابدأ اللعب</button><button id="claim" hidden>🏆 حفظ نقاط المسابقة</button></div><p id="feedback" aria-live="polite"></p></section><section class="glass"><h2 id="compTitle">🏆 المسابقة الأسبوعية</h2><p id="compStatus"></p><section id="gpsLivePanel" style="margin:16px auto;padding:18px;max-width:850px;border:2px solid #d6a451;border-radius:16px;background:#392c20;color:#fff1db;position:relative;z-index:2"><h3 style="margin:0 0 8px">📍 GPS — نظام النقاط المباشر <small>v20261114.6</small></h3><p id="gpsLiveText" aria-live="polite">العب من أي مكان، لكن حفظ النقاط متاح فقط داخل الكافيه مع GPS شغال طوال الجولة.</p><button type="button" id="gpsCheckNow" style="padding:10px 18px;border-radius:10px;background:#216940;color:white;border:1px solid #85d9a1;cursor:pointer">📍 فحص GPS</button></section><button id="login">تسجيل الدخول بـGoogle</button><button id="logout" hidden>تسجيل الخروج</button><p id="awardMsg" aria-live="polite"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./showcase-config.js"></script><script src="./showcase-gps-games.js"></script><script>
const $=id=>document.getElementById(id), game=new URLSearchParams(location.search).get('game')||'tycoon',valid=['tycoon','tower','beans'];if(!valid.includes(game))location.replace('?game=tycoon');
document.getElementById('claim').setAttribute('data-gps-claim',game==='tycoon'?'coffee_tycoon':game==='tower'?'coffee_tower':'bean_rush');const gpsGame=game==='tycoon'?'coffee_tycoon':game==='tower'?'coffee_tower':'bean_rush';const gpsStatus=document.getElementById('gpsLiveText');document.getElementById('gpsCheckNow').onclick=()=>window.ShowcaseGPS.start(gpsGame,gpsStatus).then(()=>updateCompetition());
const labels={tycoon:['☕ Coffee Shop Tycoon','☕ Coffee Shop Tycoon'],tower:['🏗️ Coffee Tower','🏗️ Coffee Tower'],beans:['🫘 Bean Rush','🫘 Bean Rush']};
const en=()=>localStorage.getItem('pickout-showcase-language')==='en',t=(a,b)=>en()?b:a;
let playing=false,finished=false,score=0,lives=3,remaining=0,timerId=0,raf=0,round=0,claimable=0,claimed=false,user=null,competition=null,objects=[],basketX=.5,lastSpawn=0,lastFrame=0;
const db=window.supabase.createClient(window.SHOWCASE_SUPABASE_URL,window.SHOWCASE_SUPABASE_PUBLISHABLE_KEY,{auth:{storageKey:'pickout-showcase-arcade-google-v1',detectSessionInUrl:true}});
function paintLabels(){document.documentElement.lang=en()?'en':'ar';document.documentElement.dir=en()?'ltr':'rtl';$('lang').textContent=en()?'العربية':'English';$('back').textContent=t('↩ الرجوع للألعاب','↩ Back to games');$('rank').textContent=t('🏆 ترتيب المسابقة','🏆 Leaderboard');$('heading').textContent=labels[game][en()?1:0];$('description').textContent=game==='tycoon'?t('إدارة كافيه حقيقية: 3 زباين بطابور، وصفات أصعب، مخزون محدود، وسرعة تحضير خلال 45 ثانية!','45-second cafe management: 3 queued customers, complex recipes, limited stock and patience!'):game==='tower'?t('ابنِ البرج بتوازن حقيقي: كل جزء خارج الكوب بيتقص، وبيصعب كل دور.','Real stacking physics: every overhang gets trimmed, making the next drop harder.'):t('25 ثانية ومحاولة واحدة! الحبوب أسرع، والمحروقة أكتر، وممنوع تضيع حبة سليمة. حرّك السلة بإصبعك أو الأسهم.','25 seconds, one life! Faster beans, more hazards, and no missed good beans. Move with touch or arrow keys.');$('start').textContent=playing?t('جاري اللعب...','Playing...'):t('▶ ابدأ من جديد','▶ Play again');$('compTitle').textContent=t('🏆 المسابقة الأسبوعية','🏆 Weekly competition');$('login').textContent=t('تسجيل الدخول بـGoogle','Sign in with Google');$('logout').textContent=t('تسجيل الخروج','Sign out');$('claim').textContent=t('🏆 حفظ نقاط المسابقة','🏆 Save competition points');updateCompetition()}
function updateStats(){$('score').textContent='⭐ '+score;$('time').textContent='⏱ '+remaining+'s';$('lives').textContent='❤️ '+lives}
function openCompetition(){let n=Date.now();return !!(competition?.is_active&&competition.starts_at&&competition.ends_at&&n>=Date.parse(competition.starts_at)&&n<=Date.parse(competition.ends_at))}
function updateCompetition(){$('login').hidden=!!user;$('logout').hidden=!user;$('compStatus').textContent=openCompetition()?t('🟢 المسابقة شغالة. سجّل بـGoogle عشان تحفظ نقاطك بعد الجولة.','🟢 Competition live. Sign in with Google to save your round points.'):t('🕒 المسابقة مش شغالة حاليًا، اللعب للتدريب فقط.','🕒 Competition is not live; practice mode only.');$('claim').hidden=!finished||!openCompetition()||!user||!claimable||claimed||!window.ShowcaseGPS.state(gpsGame)}
async function refresh(){try{const [u,c]=await Promise.all([db.auth.getUser(),db.from('showcase_competition').select('is_active,starts_at,ends_at').limit(1).maybeSingle()]);user=u.data?.user||null;competition=c.data||null}catch(e){console.warn(e)}updateCompetition()}
function stop(){playing=false;clearInterval(timerId);cancelAnimationFrame(raf);cancelAnimationFrame(orderTimer);clearTimeout(recipePeekTimer);$('start').disabled=false;paintLabels()}
function end(){if(!playing)return;stop();finished=true;claimable=Math.min(4,Math.floor(score/(game==='tycoon'?140:game==='tower'?65:100)));$('instruction').textContent=t('انتهت الجولة! نتيجتك: ','Round complete! Your score: ')+score;$('feedback').textContent=t('نقاط المسابقة المحتملة: ','Potential competition points: ')+claimable+'/4';updateCompetition()}
async function start(){$('start').disabled=true;await window.ShowcaseGPS.start(gpsGame,gpsStatus);stop();playing=true;finished=false;claimed=false;score=0;lives=game==='tycoon'?2:game==='tower'?2:1;remaining=game==='tycoon'?45:game==='tower'?35:25;round=0;objects=[];basketX=.5;lastSpawn=0;lastFrame=0;$('feedback').textContent='';$('awardMsg').textContent='';$('start').disabled=true;$('arena').replaceChildren();updateStats();paintLabels();timerId=setInterval(()=>{remaining--;updateStats();if(remaining<=0||lives<=0)end()},1000);if(game==='tycoon'){tycoon();orderTimer=requestAnimationFrame(orderTick)}else if(game==='tower')tower();else beans()}

const recipes=[
{name:'Espresso',parts:['☕'],price:18},
{name:'Latte',parts:['☕','🥛'],price:32},
{name:'Mocha',parts:['☕','🥛','🍫'],price:43},
{name:'Hot Chocolate',parts:['🥛','🍫','🍫'],price:37},
{name:'Double Espresso',parts:['☕','☕'],price:30},
{name:'Iced Mocha',parts:['🧊','☕','🥛','🍫'],price:55}
];
let stock=[7,6,5,4],currentOrder=null,chosen=[],orderDeadline=0,orderTimer=0,queue=[],cash=0,combo=0,served=0,recipePeekTimer=0,recipeVisibleUntil=0;
const ingredients=['☕','🥛','🍫','🧊'];
function tycoon(){stock=[7,6,5,4];queue=[];cash=0;combo=0;served=0;for(let i=0;i<3;i++)spawnCustomer();newOrder()}
function spawnCustomer(){const recipe=recipes[Math.floor(Math.random()*recipes.length)];queue.push({recipe,deadline:performance.now()+Math.max(4200,8500-served*230)+queue.length*1500,id:Math.random()})}
function newOrder(){if(!playing)return;while(queue.length<3)spawnCustomer();currentOrder=queue[0];chosen=[];orderDeadline=currentOrder.deadline;recipeVisibleUntil=performance.now()+1000;clearTimeout(recipePeekTimer);renderOrder();recipePeekTimer=setTimeout(()=>{if(playing&&currentOrder){const el=$('recipePeek');if(el)el.textContent=t('🙈 الوصفة اختفت! حضّرها من ذاكرتك','🙈 Recipe hidden! Prepare it from memory')}},1000)}
function orderTick(){if(!playing||game!=='tycoon')return;const now=performance.now();let expired=queue.filter(o=>o.deadline<=now);if(expired.length){queue=queue.filter(o=>o.deadline>now);lives=Math.max(0,lives-expired.length);combo=0;$('feedback').textContent=t('💥 زباين مشيوا بسبب التأخير!','💥 Customers left because of delays!');updateStats();if(lives<=0){end();return}newOrder()}else{const node=$('orderCountdown');if(node)node.textContent=t('⏱ مهلة العميل: ','⏱ Customer patience: ')+Math.max(0,(orderDeadline-now)/1000).toFixed(1)+'s';const q=$('queueView');if(q)q.textContent=queue.map((o,i)=>'🧍'+(i+1)+' '+o.recipe.name+' '+Math.max(0,(o.deadline-now)/1000).toFixed(0)+'s').join('  |  ')}orderTimer=requestAnimationFrame(orderTick)}
function renderOrder(){const arena=$('arena');arena.replaceChildren();const wrap=document.createElement('div');wrap.style.cssText='width:100%;text-align:center';const title=document.createElement('h2');title.textContent=t('🔥 كاشير + باريستا: ','🔥 Cashier + barista: ')+currentOrder.recipe.name;wrap.append(title);
const q=document.createElement('p');q.id='queueView';q.style.cssText='font-size:12px;color:#f7c793';wrap.append(q);
const p=document.createElement('p');p.id='recipePeek';p.style.cssText='font-size:20px;font-weight:800;min-height:35px;color:#ffe1a4';p.textContent=performance.now()<recipeVisibleUntil?t('👀 احفظ الوصفة: ','👀 Memorize: ')+currentOrder.recipe.parts.join(' → '):t('🙈 الوصفة اختفت! حضّرها من ذاكرتك','🙈 Recipe hidden! Prepare it from memory');wrap.append(p);
const inv=document.createElement('p');inv.textContent=ingredients.map((v,i)=>v+' '+stock[i]).join('   ');wrap.append(inv);
const clock=document.createElement('p');clock.id='orderCountdown';clock.style.color='#ff9f78';wrap.append(clock);
const selected=document.createElement('p');selected.textContent=t('التحضير: ','Preparation: ')+(chosen.join(' → ')||'—');wrap.append(selected);
const buttons=document.createElement('div');buttons.className='tiles';ingredients.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(!playing||performance.now()>=orderDeadline)return;if(stock[i]<=0){$('feedback').textContent=t('📦 المخزون خلص!','📦 Out of stock!');return}stock[i]--;chosen.push(v);const needed=currentOrder.recipe.parts;if(chosen[chosen.length-1]!==needed[chosen.length-1]){lives--;combo=0;$('feedback').textContent=t('❌ مكون غلط، خسرت محاولة!','❌ Wrong ingredient! Life lost');updateStats();if(lives<=0){end();return}chosen=[];renderOrder();return}
if(chosen.length===needed.length){served++;combo++;cash+=currentOrder.recipe.price;score+=Math.round(12+Math.min(18,combo*3)+Math.max(0,(orderDeadline-performance.now())/1000)*2);queue.shift();spawnCustomer();$('feedback').textContent=t('✅ طلب ناجح! سلسلة: ','✅ Served! Combo: ')+combo+' | 💰 '+cash;updateStats();newOrder()}else renderOrder()};buttons.append(b)});wrap.append(buttons);
const refill=document.createElement('button');refill.style.marginTop='14px';refill.textContent=t('📦 اشترِ مخزون (-35 نقطة، -3 ثواني)','📦 Restock (-35 points, -3 seconds)');refill.onclick=()=>{if(!playing)return;stock=[7,6,5,4];score=Math.max(0,score-35);queue.forEach(o=>o.deadline-=3000);renderOrder();updateStats()};wrap.append(refill);arena.append(wrap);$('instruction').textContent=t('3 زباين في الطابور! الوصفة بتظهر ثانية واحدة بس، وبعدها لازم تحضّرها من ذاكرتك قبل ما صبرهم يخلص.','Three customers in queue! The recipe appears for only one second, then prepare it from memory before patience runs out.')}
let towerPos=0,towerDir=1,towerLast=0,towerWidth=100,towerCenter=0,towerMoveWidth=100,towerDropLocked=false;
function tower(){towerPos=0;towerDir=1;towerLast=0;towerWidth=100;towerCenter=0;towerMoveWidth=100;towerDropLocked=false;renderTower();raf=requestAnimationFrame(towerTick)}
function renderTower(){const arena=$('arena');arena.replaceChildren();const stage=document.createElement('div');stage.style.cssText='position:relative;width:min(100%,430px);height:290px;overflow:hidden;border-radius:12px;background:linear-gradient(#36251b,#62432d)';stage.id='towerStage';const base=document.createElement('div');base.style.cssText='position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:130px;height:15px;border-radius:6px;background:#c89c65';stage.append(base);
for(let i=0;i<round;i++){const layer=document.createElement('div');layer.style.cssText='position:absolute;bottom:'+(27+i*19)+'px;left:calc(50% + '+towerCenter+'px);transform:translateX(-50%);width:'+towerWidth+'px;height:18px;border:2px solid #f7e3c6;border-radius:4px;background:linear-gradient(#b78451,#6d432a)';stage.append(layer)}
const moving=document.createElement('div');moving.id='moving';moving.style.cssText='position:absolute;bottom:'+(27+round*19)+'px;left:50%;transform:translateX(-50%);width:'+towerMoveWidth+'px;height:18px;border:2px solid #fff0d7;border-radius:4px;background:#d2a26a;box-shadow:0 0 14px #eec38d';stage.append(moving);arena.append(stage);$('instruction').textContent=t('اضغط لإسقاط الكوب فوق اللي تحته. الجزء اللي خارج التوازن بيتقص، والبرج بيضيق!','Tap to drop the cup onto the stack. Any overhang is trimmed, shrinking the tower!')}
function towerTick(now){if(!playing)return;const dt=Math.min(40,now-(towerLast||now));towerLast=now;const range=Math.min(125,Math.max(70,160-towerWidth/2));towerPos+=towerDir*dt*(.22+round*.035)*(1+.18*Math.sin(now*.007));if(Math.abs(towerPos)>range){towerDir*=-1;towerPos=Math.max(-range,Math.min(range,towerPos))}const el=$('moving');if(el)el.style.left='calc(50% + '+towerPos+'px)';raf=requestAnimationFrame(towerTick)}
$('arena').addEventListener('pointerdown',()=>{if(!playing||game!=='tower'||towerDropLocked)return;towerDropLocked=true;const left=Math.max(towerPos-towerMoveWidth/2,towerCenter-towerWidth/2);const right=Math.min(towerPos+towerMoveWidth/2,towerCenter+towerWidth/2);const overlap=right-left;if(overlap<12){lives--;$('feedback').textContent=t('💥 الكوب وقع برّه البرج!','💥 Cup missed the tower!');updateStats()}else{towerCenter=(left+right)/2;towerWidth=overlap;towerMoveWidth=overlap;round++;score+=Math.round(10+overlap/4);$('feedback').textContent=t('🎯 اتثبت! عرض البرج: ','🎯 Stacked! Width: ')+Math.round(overlap)+'px';updateStats()}if(lives<=0||round>=12||towerWidth<14){end();return}towerPos=-105;towerDir=1;renderTower();towerDropLocked=false});
let basket=null;
function beans(){basket=document.createElement('div');basket.className='basket';basket.textContent='🧺';$('arena').append(basket);$('instruction').textContent=t('اسحب بإصبعك أو استخدم الأسهم لجمع الحبوب البنية فقط','Drag or use arrow keys to catch only brown beans');raf=requestAnimationFrame(beanTick)}
function moveBasket(x){basketX=Math.max(.06,Math.min(.94,x));if(basket)basket.style.left='calc('+basketX*100+'% - 28px)'}
$('arena').addEventListener('pointermove',e=>{if(game==='beans'&&playing&&e.buttons){const r=$('arena').getBoundingClientRect();moveBasket((e.clientX-r.left)/r.width)}});
$('arena').addEventListener('pointerdown',e=>{if(game==='beans'&&playing){const r=$('arena').getBoundingClientRect();moveBasket((e.clientX-r.left)/r.width)}});
document.addEventListener('keydown',e=>{if(game!=='beans'||!playing)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();moveBasket(basketX+(e.key==='ArrowRight'?.08:-.08))}});
function beanTick(now){if(!playing)return;const r=$('arena').getBoundingClientRect();const dt=Math.min(50,now-(lastFrame||now));lastFrame=now;if(now-lastSpawn>Math.max(145,340-round*4)){const bad=Math.random()<.48;const el=document.createElement('span');el.className='fall';el.textContent=bad?'🔴':'🫘';$('arena').append(el);objects.push({el,x:.07+Math.random()*.86,y:-.1,bad});lastSpawn=now;round++}for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.y+=dt*(.00065+Math.min(.00065,round*.000012));o.el.style.left=o.x*100+'%';o.el.style.top=o.y*100+'%';if(o.y>.78&&Math.abs(o.x-basketX)<.1){if(o.bad){lives--; $('feedback').textContent=t('🔥 حبة محروقة!','🔥 Burnt bean!')}else{score+=10;$('feedback').textContent=t('🫘 +10 نقاط','🫘 +10 points')}o.el.remove();objects.splice(i,1);updateStats()}else if(o.y>1){if(!o.bad){lives--;$('feedback').textContent=t('💨 ضيّعت حبة!','💨 Missed a bean!');updateStats()}o.el.remove();objects.splice(i,1)}}moveBasket(basketX);if(lives<=0){end();return}raf=requestAnimationFrame(beanTick)}
$('start').onclick=start;$('lang').onclick=()=>{localStorage.setItem('pickout-showcase-language',en()?'ar':'en');paintLabels()};
$('login').onclick=async()=>{const {error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname+location.search}});if(error)$('awardMsg').textContent=error.message};
$('logout').onclick=async()=>{await db.auth.signOut();refresh()};
$('claim').onclick=async()=>{if(!finished||claimed||!claimable||!window.ShowcaseGPS.state(gpsGame))return;$('claim').disabled=true;try{await window.ShowcaseGPS.claim(gpsGame,claimable,$('awardMsg'));claimed=true}catch(e){console.warn('GPS claim rejected',e)}finally{$('claim').disabled=false;updateCompetition()}};
db.auth.onAuthStateChange(()=>setTimeout(refresh,0));paintLabels();refresh();$('instruction').textContent=t('اضغط ابدأ عشان تلعب','Press start to play');
</script></body></html>
