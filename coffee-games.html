<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PICK & OUT | Games</title><style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#fff5e9;background:#21140f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#70452b80,transparent 55%),repeating-linear-gradient(0deg,#331c15 0 37px,#1c100c 38px 41px)}header,main{max-width:960px;margin:auto;padding:18px}header{display:flex;gap:12px;justify-content:space-between;align-items:center}a{color:#ffdb9a}button,.btn{border:1px solid #d9a86b;border-radius:13px;background:#4c2c1b;color:#fff3dd;padding:12px 17px;cursor:pointer;font-weight:700;text-decoration:none}button:hover,.btn:hover{background:#74472b}button:disabled{opacity:.5;cursor:default}.glass{background:#21170edc;border:1px solid #b7804d75;box-shadow:0 12px 40px #0007;border-radius:22px;padding:20px;margin:18px 0}h1{font-size:clamp(26px,5vw,44px);margin:10px 0}h2{font-size:23px}p{line-height:1.6}.muted{color:#e0c5a5}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#5a3523;border-radius:12px;padding:10px 16px}.arena{position:relative;min-height:330px;border-radius:18px;background:linear-gradient(135deg,#69432d,#302018);overflow:hidden;display:grid;place-items:center;padding:15px}.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.tiles button{font-size:28px;min-width:70px}.cup{width:110px;height:72px;border:5px solid #f5dfbf;border-radius:10px 10px 32px 32px;background:linear-gradient(#b98555,#51301d);box-shadow:inset 0 12px #e5c09c;display:grid;place-items:center;font-size:32px}.tower{display:flex;flex-direction:column-reverse;align-items:center;gap:2px}.tower .cup{height:37px;width:90px;font-size:19px}.fall{position:absolute;font-size:36px;touch-action:none;user-select:none}.basket{position:absolute;bottom:12px;font-size:55px;transition:left .07s linear}.orders{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.order{border:1px solid #c89a64;background:#382318;border-radius:12px;padding:13px;min-width:145px}.order strong{display:block;margin-bottom:8px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1}#awardMsg{min-height:20px}@media(max-width:600px){header{flex-wrap:wrap}.glass{padding:14px}.arena{min-height:290px}.tiles button{min-width:60px;padding:10px}.order{min-width:120px}}</style></head><body><header><a href="./index.html#games" id="back">↩ الرجوع للألعاب</a><a href="./arcade.html" id="rank">🏆 ترتيب المسابقة</a><button id="lang">English</button></header><main><h1 id="heading"></h1><p class="muted" id="description"></p><section class="glass"><div class="stats"><div class="stat" id="score">⭐ 0</div><div class="stat" id="time">⏱ 0</div><div class="stat" id="lives">❤️ 3</div></div><p id="instruction"></p><div class="arena" id="arena"></div><div class="actions"><button id="start">▶ ابدأ اللعب</button><button id="claim" hidden>🏆 حفظ نقاط المسابقة</button></div><p id="feedback" aria-live="polite"></p></section><section class="glass"><h2 id="compTitle">🏆 المسابقة الأسبوعية</h2><p id="compStatus"></p><button id="login">تسجيل الدخول بـGoogle</button><button id="logout" hidden>تسجيل الخروج</button><p id="awardMsg" aria-live="polite"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./showcase-config.js"></script><script>
const $=id=>document.getElementById(id), game=new URLSearchParams(location.search).get('game')||'tycoon',valid=['tycoon','tower','beans'];if(!valid.includes(game))location.replace('?game=tycoon');
const labels={tycoon:['☕ Coffee Shop Tycoon','☕ Coffee Shop Tycoon'],tower:['🏗️ Coffee Tower','🏗️ Coffee Tower'],beans:['🫘 Bean Rush','🫘 Bean Rush']};
const en=()=>localStorage.getItem('pickout-showcase-language')==='en',t=(a,b)=>en()?b:a;
let playing=false,finished=false,score=0,lives=3,remaining=0,timerId=0,raf=0,round=0,claimable=0,claimed=false,user=null,competition=null,objects=[],basketX=.5,lastSpawn=0,lastFrame=0;
const db=window.supabase.createClient(window.SHOWCASE_SUPABASE_URL,window.SHOWCASE_SUPABASE_PUBLISHABLE_KEY,{auth:{storageKey:'pickout-showcase-arcade-google-v1',detectSessionInUrl:true}});
function paintLabels(){document.documentElement.lang=en()?'en':'ar';document.documentElement.dir=en()?'ltr':'rtl';$('lang').textContent=en()?'العربية':'English';$('back').textContent=t('↩ الرجوع للألعاب','↩ Back to games');$('rank').textContent=t('🏆 ترتيب المسابقة','🏆 Leaderboard');$('heading').textContent=labels[game][en()?1:0];$('description').textContent=game==='tycoon'?t('شغّل الكافيه في 40 ثانية، وكل طلب له مهلة قصيرة ومحاولتين فقط!','40-second rush: each order has a strict deadline and only two lives!'):game==='tower'?t('برج سريع جدًا! هدف ضيق ومحاولتين بس خلال 28 ثانية.','Ultra-fast tower: tiny target, two lives, 28 seconds.'):t('25 ثانية ومحاولة واحدة! الحبوب أسرع، والمحروقة أكتر، وممنوع تضيع حبة سليمة. حرّك السلة بإصبعك أو الأسهم.','25 seconds, one life! Faster beans, more hazards, and no missed good beans. Move with touch or arrow keys.');$('start').textContent=playing?t('جاري اللعب...','Playing...'):t('▶ ابدأ من جديد','▶ Play again');$('compTitle').textContent=t('🏆 المسابقة الأسبوعية','🏆 Weekly competition');$('login').textContent=t('تسجيل الدخول بـGoogle','Sign in with Google');$('logout').textContent=t('تسجيل الخروج','Sign out');$('claim').textContent=t('🏆 حفظ نقاط المسابقة','🏆 Save competition points');updateCompetition()}
function updateStats(){$('score').textContent='⭐ '+score;$('time').textContent='⏱ '+remaining+'s';$('lives').textContent='❤️ '+lives}
function openCompetition(){let n=Date.now();return !!(competition?.is_active&&competition.starts_at&&competition.ends_at&&n>=Date.parse(competition.starts_at)&&n<=Date.parse(competition.ends_at))}
function updateCompetition(){$('login').hidden=!!user;$('logout').hidden=!user;$('compStatus').textContent=openCompetition()?t('🟢 المسابقة شغالة. سجّل بـGoogle عشان تحفظ نقاطك بعد الجولة.','🟢 Competition live. Sign in with Google to save your round points.'):t('🕒 المسابقة مش شغالة حاليًا، اللعب للتدريب فقط.','🕒 Competition is not live; practice mode only.');$('claim').hidden=!finished||!openCompetition()||!claimable||claimed}
async function refresh(){try{const [u,c]=await Promise.all([db.auth.getUser(),db.from('showcase_competition').select('is_active,starts_at,ends_at').limit(1).maybeSingle()]);user=u.data?.user||null;competition=c.data||null}catch(e){console.warn(e)}updateCompetition()}
function stop(){playing=false;clearInterval(timerId);cancelAnimationFrame(raf);cancelAnimationFrame(orderTimer);$('start').disabled=false;paintLabels()}
function end(){if(!playing)return;stop();finished=true;claimable=Math.min(4,Math.floor(score/(game==='tycoon'?110:game==='tower'?80:100)));$('instruction').textContent=t('انتهت الجولة! نتيجتك: ','Round complete! Your score: ')+score;$('feedback').textContent=t('نقاط المسابقة المحتملة: ','Potential competition points: ')+claimable+'/4';updateCompetition()}
function start(){stop();playing=true;finished=false;claimed=false;score=0;lives=game==='tycoon'?2:game==='tower'?2:1;remaining=game==='tycoon'?40:game==='tower'?28:25;round=0;objects=[];basketX=.5;lastSpawn=0;lastFrame=0;$('feedback').textContent='';$('awardMsg').textContent='';$('start').disabled=true;$('arena').replaceChildren();updateStats();paintLabels();timerId=setInterval(()=>{remaining--;updateStats();if(remaining<=0||lives<=0)end()},1000);if(game==='tycoon'){tycoon();orderTimer=requestAnimationFrame(orderTick)}else if(game==='tower')tower();else beans()}
const recipes=[{name:'Espresso',parts:['☕'],stock:[1,0,0]},{name:'Latte',parts:['☕','🥛'],stock:[1,1,0]},{name:'Mocha',parts:['☕','🥛','🍫'],stock:[1,1,1]}];
let stock=[5,4,3],currentOrder=null,chosen=[],orderDeadline=0,orderTimer=0;
function tycoon(){stock=[5,4,3];newOrder()}
function newOrder(){if(!playing)return;currentOrder=recipes[Math.floor(Math.random()*recipes.length)];chosen=[];orderDeadline=performance.now()+Math.max(2400,4600-round*160);renderOrder()}
function orderTick(){if(!playing||game!=='tycoon')return;const left=orderDeadline-performance.now();const node=$('orderCountdown');if(node)node.textContent=t('⏱ باقي للطلب: ','⏱ Order deadline: ')+Math.max(0,left/1000).toFixed(1)+'s';if(left<=0){lives--;$('feedback').textContent=t('💥 العميل مشي! خسرت محاولة','💥 Customer left! Life lost');updateStats();if(lives<=0){end();return}newOrder()}orderTimer=requestAnimationFrame(orderTick)}
function renderOrder(){const arena=$('arena');arena.replaceChildren();const wrap=document.createElement('div');wrap.style.textAlign='center';const h=document.createElement('h2');h.textContent=t('🔥 طلب سريع: ','Customer order: ')+currentOrder.name;wrap.append(h);const p=document.createElement('p');p.textContent=t('المكونات المطلوبة: ','Ingredients: ')+currentOrder.parts.join(' + ');wrap.append(p);const inv=document.createElement('p');inv.textContent='☕ '+stock[0]+'  🥛 '+stock[1]+'  🍫 '+stock[2];wrap.append(inv);const countdown=document.createElement('p');countdown.id='orderCountdown';countdown.style.color='#ffb58a';wrap.append(countdown);const selected=document.createElement('p');selected.textContent=t('اختيارك: ','Your mix: ')+chosen.join(' ');wrap.append(selected);const buttons=document.createElement('div');buttons.className='tiles';['☕','🥛','🍫'].forEach((v,i)=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(!playing)return;if(performance.now()>orderDeadline)return;if(stock[i]<=0){$('feedback').textContent=t('المكون خلص! استخدم إعادة التعبئة','Out of stock! Refill first');return}stock[i]--;chosen.push(v);if(chosen.length>=currentOrder.parts.length){if(chosen.join('')===currentOrder.parts.join('')){score+=15+Math.min(8,round);round++;$('feedback').textContent=t('✅ طلب صحيح!','✅ Order complete!')}else{lives--;$('feedback').textContent=t('❌ طلب غلط!','❌ Wrong order!')}updateStats();if(lives<=0){end();return}newOrder()}else renderOrder()};buttons.append(b)});wrap.append(buttons);const refill=document.createElement('button');refill.style.marginTop='15px';refill.textContent=t('📦 إعادة تعبئة (خصم 25 نقطة)','📦 Refill (-25 points)');refill.onclick=()=>{stock=[5,4,3];score=Math.max(0,score-25);updateStats();renderOrder()};wrap.append(refill);arena.append(wrap);$('instruction').textContent=t('اضغط المكونات بالترتيب المطلوب، وراقب المخزون.','Tap ingredients in the correct order and watch your stock.')}
let towerPos=0,towerDir=1,towerLast=0;
function tower(){towerPos=0;towerDir=1;towerLast=0;renderTower();raf=requestAnimationFrame(towerTick)}
function renderTower(){const arena=$('arena');arena.replaceChildren();const wrap=document.createElement('div');wrap.className='tower';for(let i=0;i<round;i++){const c=document.createElement('div');c.className='cup';c.textContent='☕';wrap.append(c)}arena.append(wrap);const moving=document.createElement('div');moving.className='cup';moving.id='moving';moving.style.cssText='position:absolute;top:22px;left:calc(50% - 45px);width:90px;height:38px;font-size:18px';moving.textContent='☕';arena.append(moving);$('instruction').textContent=t('اضغط في أي مكان داخل اللوحة لإسقاط الكوب في المنتصف','Tap anywhere in the arena to drop the cup in the center')}
function towerTick(now){if(!playing)return;const dt=Math.min(40,now-(towerLast||now));towerLast=now;towerPos+=towerDir*dt*(.00095+round*.00013)*(1+.23*Math.sin(now*.011));if(Math.abs(towerPos)>.42){towerDir*=-1;towerPos=Math.max(-.42,Math.min(.42,towerPos))};const el=$('moving');if(el)el.style.transform='translateX('+towerPos*300+'px)';raf=requestAnimationFrame(towerTick)}
$('arena').addEventListener('pointerdown',()=>{if(!playing||game!=='tower')return;if(Math.abs(towerPos)<Math.max(.022,.055-round*.002)){round++;score+=25;updateStats();$('feedback').textContent=t('🎯 ممتاز!','🎯 Perfect!')}else{lives--;$('feedback').textContent=t('💥 الكوب وقع!','💥 Cup missed!');updateStats()}if(lives<=0){end();return}renderTower()});
let basket=null;
function beans(){basket=document.createElement('div');basket.className='basket';basket.textContent='🧺';$('arena').append(basket);$('instruction').textContent=t('اسحب بإصبعك أو استخدم الأسهم لجمع الحبوب البنية فقط','Drag or use arrow keys to catch only brown beans');raf=requestAnimationFrame(beanTick)}
function moveBasket(x){basketX=Math.max(.06,Math.min(.94,x));if(basket)basket.style.left='calc('+basketX*100+'% - 28px)'}
$('arena').addEventListener('pointermove',e=>{if(game==='beans'&&playing&&e.buttons){const r=$('arena').getBoundingClientRect();moveBasket((e.clientX-r.left)/r.width)}});
$('arena').addEventListener('pointerdown',e=>{if(game==='beans'&&playing){const r=$('arena').getBoundingClientRect();moveBasket((e.clientX-r.left)/r.width)}});
document.addEventListener('keydown',e=>{if(game!=='beans'||!playing)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();moveBasket(basketX+(e.key==='ArrowRight'?.08:-.08))}});
function beanTick(now){if(!playing)return;const r=$('arena').getBoundingClientRect();const dt=Math.min(50,now-(lastFrame||now));lastFrame=now;if(now-lastSpawn>Math.max(145,340-round*4)){const bad=Math.random()<.48;const el=document.createElement('span');el.className='fall';el.textContent=bad?'🔴':'🫘';$('arena').append(el);objects.push({el,x:.07+Math.random()*.86,y:-.1,bad});lastSpawn=now;round++}for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.y+=dt*(.00065+Math.min(.00065,round*.000012));o.el.style.left=o.x*100+'%';o.el.style.top=o.y*100+'%';if(o.y>.78&&Math.abs(o.x-basketX)<.1){if(o.bad){lives--; $('feedback').textContent=t('🔥 حبة محروقة!','🔥 Burnt bean!')}else{score+=10;$('feedback').textContent=t('🫘 +10 نقاط','🫘 +10 points')}o.el.remove();objects.splice(i,1);updateStats()}else if(o.y>1){if(!o.bad){lives--;$('feedback').textContent=t('💨 ضيّعت حبة!','💨 Missed a bean!');updateStats()}o.el.remove();objects.splice(i,1)}}moveBasket(basketX);if(lives<=0){end();return}raf=requestAnimationFrame(beanTick)}
$('start').onclick=start;$('lang').onclick=()=>{localStorage.setItem('pickout-showcase-language',en()?'ar':'en');paintLabels()};
$('login').onclick=async()=>{const {error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname+location.search}});if(error)$('awardMsg').textContent=error.message};
$('logout').onclick=async()=>{await db.auth.signOut();refresh()};
$('claim').onclick=async()=>{if(!finished||claimed||!claimable)return;await refresh();if(!user){$('awardMsg').textContent=t('سجّل بـGoogle الأول','Sign in with Google first');return}if(!openCompetition()){$('awardMsg').textContent=t('المسابقة غير متاحة','Competition unavailable');return}$('claim').disabled=true;const {data,error}=await db.rpc('showcase_award_points',{p_game:game==='tycoon'?'coffee_tycoon':game==='tower'?'coffee_tower':'bean_rush',p_points:claimable});$('claim').disabled=false;if(error){$('awardMsg').textContent=error.message;return}claimed=true;$('awardMsg').textContent=t('✅ اتحفظت النقاط! مجموعك: ','✅ Points saved! Total: ')+data;updateCompetition()};
db.auth.onAuthStateChange(()=>setTimeout(refresh,0));paintLabels();refresh();$('instruction').textContent=t('اضغط ابدأ عشان تلعب','Press start to play');
</script></body></html>
