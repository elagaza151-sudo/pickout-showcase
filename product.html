<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل المنتج | PICK & OUT</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:#f6e8d6;font-family:Cairo,sans-serif;background:radial-gradient(circle at 70% 30%,#64412b,transparent 43%),linear-gradient(135deg,#170e0a,#2e1c13 65%,#140b08);overflow-x:hidden}
main{min-height:100vh;max-width:1200px;margin:auto;padding:30px 24px 60px;display:flex;flex-direction:column;justify-content:center}.back{align-self:flex-start;display:inline-flex;align-items:center;gap:12px;color:#fff0d8;text-decoration:none;font-weight:800;background:linear-gradient(130deg,#855933,#3a2417);border:1px solid #e1ad6c99;padding:12px 22px;border-radius:80px;box-shadow:0 10px 30px #0005;transition:.3s}.back:hover{transform:translateY(-4px) scale(1.04);box-shadow:0 12px 36px #e1ad6c44}.back b{display:grid;place-items:center;border-radius:50%;width:32px;height:32px;background:#e1ad6c;color:#29180e;transition:.3s}.back:hover b{transform:rotate(-35deg) translateX(4px)}
.layout{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(30px,7vw,90px);align-items:center;margin-top:30px}.visual{position:relative;display:grid;place-items:center;min-height:420px;perspective:1000px}.visual:before{content:"";position:absolute;width:70%;aspect-ratio:1;background:#e1ad6c33;border-radius:50%;filter:blur(60px);animation:glow 4s ease-in-out infinite alternate}.visual img{position:relative;max-width:100%;max-height:440px;object-fit:contain;filter:drop-shadow(0 30px 25px #000a);transform:rotateY(var(--rotate,0deg)) translateY(var(--float,0px));transition:transform .18s ease;animation:float 4s ease-in-out infinite alternate}.tag{color:#e8b576;letter-spacing:2px;font-weight:800}h1{font-size:clamp(36px,5vw,68px);line-height:1.2;margin:12px 0 20px}p{line-height:1.9;color:#d8c5b0}.price{font-size:30px;font-weight:800;color:#e8b576;margin:22px 0}.ingredients{border-top:1px solid #ffffff33;padding-top:18px}.visual .fallback{font-size:130px}.fade{animation:reveal .8s both}
@keyframes reveal{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}@keyframes glow{to{transform:scale(1.12);opacity:.5}}@keyframes float{to{translate:0 -14px}}
@media(max-width:720px){.layout{grid-template-columns:1fr;gap:8px}.visual{min-height:260px}.visual img{max-height:310px}main{justify-content:flex-start}.back{margin-bottom:10px}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style></head><body><main><a class="back" href="./index.html#menu"><b>↩</b><span id="backText">الرجوع للمنيو</span></a><div class="layout"><div class="visual fade" id="visual"><img id="photo" alt="" hidden><span class="fallback" id="fallback">☕</span></div><div class="fade"><div class="tag" id="category">PICK & OUT</div><h1 id="name">تفاصيل المنتج</h1><p id="description"></p><div class="price" id="price"></div><div class="ingredients"><strong id="ingredientsTitle">المكونات</strong><p id="ingredients"></p></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./showcase-config.js"></script><script>
(async function(){const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),id=params.get('id'),name=params.get('name'),en=localStorage.getItem('pickout-showcase-language')==='en';if(en){document.documentElement.lang='en';document.documentElement.dir='ltr';$('backText').textContent='Back to menu';$('ingredientsTitle').textContent='Ingredients'}
let product=null;try{if(window.supabase&&window.SHOWCASE_SUPABASE_URL){const db=window.supabase.createClient(window.SHOWCASE_SUPABASE_URL,window.SHOWCASE_SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:false}});const q=db.from('showcase_products').select('*').eq('is_active',true);let r;if(id)r=await q.eq('id',id).maybeSingle();else if(name)r=await q.eq('name',name).maybeSingle();if(r&&!r.error)product=r.data}}catch(e){console.warn('Product loading:',e)}
if(!product&&name){product={name,category:params.get('category')||'',price:params.get('price')||'',image_url:params.get('image')||''}}
if(!product){$('name').textContent=en?'Product not found':'المنتج غير موجود';return}
$('name').textContent=product.name||'';document.title=product.name+' | PICK & OUT';$('category').textContent=product.category||'PICK & OUT';$('price').textContent=product.price!=null?product.price+' '+(en?'EGP':'جنيه'):'';$('description').textContent=product.description||(en?'Explore this product from PICK & OUT.':'اكتشف المنتج ده من منيو PICK & OUT.');$('ingredients').textContent=product.ingredients||(en?'Ingredient details coming soon.':'تفاصيل المكونات هتتضاف قريب.');
if(product.image_url){$('photo').src=product.image_url;$('photo').alt=product.name;$('photo').hidden=false;$('fallback').hidden=true}
const visual=$('visual');visual.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const b=visual.getBoundingClientRect();$('photo').style.setProperty('--rotate',((e.clientX-b.left)/b.width-.5)*28+'deg')});visual.addEventListener('pointerleave',()=>$('photo').style.setProperty('--rotate','0deg'));
})();
</script></body></html>
