<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PICK & OUT | Fun Games</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#543325,#160f0c 70%);font:16px Tahoma,Arial;color:#fff3df}main{max-width:850px;margin:auto;padding:24px}a{color:#f4ce8c}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:25px 0}.card,.panel{background:#ffffff10;border:1px solid #b88b5770;border-radius:20px;padding:20px}.card{cursor:pointer;text-align:center;font:inherit;color:inherit}.card:hover,.card:focus{background:#65432f}.card span{display:block;font-size:42px;margin-bottom:12px}.panel{min-height:240px}input,select,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #bda487;background:#fffaf3;color:#21170e;font:inherit;margin:8px 0 14px}button.action{padding:13px 22px;background:#e5b970;color:#23160e;border:0;border-radius:11px;font:inherit;cursor:pointer}.result{font-size:24px;color:#f6d39b;font-weight:bold;margin:20px 0;min-height:36px}.muted{color:#d8c5ad;font-size:14px}.hidden{display:none}</style></head><body><main><a href="./index.html">↩ العودة للمنيو</a><h1>🎲 PICK & OUT Fun Zone</h1><p>أربع تجارب تفاعلية للتسلية، بدون تسجيل أو نقاط.</p><div class="cards"><button class="card" data-tool="ai"><span>🤖</span>AI Drink Picker</button><button class="card" data-tool="spin"><span>✨</span>Your Mood, Our Pick</button><button class="card" data-tool="payer"><span>🎡</span>Who Pays?</button><button class="card" data-tool="split"><span>🧮</span>Split the Bill</button></div><section class="panel"><h2 id="heading">اختار لعبة من فوق 👆</h2><div id="content"></div><div id="result" class="result" aria-live="polite"></div><p class="muted">الألعاب دي مش ضمن المسابقة الأسبوعية ومش بتضيف نقاط.</p></section></main><script>
(function(){
'use strict';
const $=id=>document.getElementById(id),content=$('content'),result=$('result');
const drinks=[['Iced Latte','بارد','قهوة',85],['Cappuccino','ساخن','قهوة',80],['Hot Chocolate','ساخن','حلو',75],['Mango Smoothie','بارد','فاكهة',90],['Mocha','ساخن','حلو',90],['Iced Spanish Latte','بارد','حلو',95],['Green Tea','ساخن','خفيف',38],['Lemon Mint','بارد','فاكهة',70]];
const choose=arr=>arr[Math.floor(Math.random()*arr.length)];
function reset(title,html){$('heading').textContent=title;content.innerHTML=html;result.textContent=''}
function showDrink(d){result.textContent=d[0]+' — '+d[3]+' جنيه (سعر توضيحي)'}
function open(tool){
if(tool==='ai'){reset('🤖 AI Drink Picker','<p>قولنا نفسك في إيه ونقترحلك مشروب مناسب</p><label>درجة الحرارة<select id="temp"><option value="بارد">بارد</option><option value="ساخن">ساخن</option></select></label><label>الطعم<select id="taste"><option value="قهوة">قهوة</option><option value="حلو">حلو</option><option value="فاكهة">فاكهة</option><option value="خفيف">خفيف</option></select></label><button class="action" id="go">اقترحلي</button>');$('go').onclick=()=>{const arr=drinks.filter(d=>d[1]===$('temp').value&&d[2]===$('taste').value);showDrink(choose(arr.length?arr:drinks.filter(d=>d[1]===$('temp').value)))}}
else if(tool==='spin'){reset('✨ Your Mood, Our Pick','<p>سيب الحظ يختارلك مشروب</p><button class="action" id="go">🎲 اختارلي</button>');$('go').onclick=()=>showDrink(choose(drinks))}
else if(tool==='payer'){reset('🎡 Who Pays?','<p>اكتب أسماء الشلة، كل اسم في سطر، وسيب العجلة تختار</p><textarea id="names" rows="5" placeholder="أحمد&#10;محمد&#10;سارة"></textarea><button class="action" id="go">لف العجلة 🎡</button>');$('go').onclick=()=>{const names=$('names').value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);if(names.length<2){result.textContent='اكتب اسمين على الأقل';return}let ticks=0;const timer=setInterval(()=>{result.textContent='🎡 '+choose(names);ticks++;if(ticks>=15){clearInterval(timer);result.textContent='💸 اللي هيحاسب: '+choose(names)}},95)}}
else if(tool==='split'){reset('🧮 Split the Bill','<label>إجمالي الحساب بالجنيه<input id="total" type="number" min="0" step="0.01" placeholder="مثلاً 450"></label><label>عدد الأشخاص<input id="people" type="number" min="1" max="100" value="3"></label><label>نسبة خدمة إضافية % (اختياري)<input id="service" type="number" min="0" max="100" value="0"></label><button class="action" id="go">احسب نصيب الفرد</button>');$('go').onclick=()=>{const total=Number($('total').value),people=Number($('people').value),service=Number($('service').value);if(total<=0||!Number.isInteger(people)||people<1||service<0||service>100){result.textContent='راجع الأرقام المدخلة';return}result.textContent='نصيب الفرد: '+(total*(1+service/100)/people).toFixed(2)+' جنيه'}}
}
document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>open(b.dataset.tool)));
const tool=new URLSearchParams(location.search).get('tool');if(['ai','spin','payer','split'].includes(tool))open(tool);
})();
</script></body></html>
