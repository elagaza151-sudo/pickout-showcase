<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PICK & OUT Arcade</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 30% 0,#5b3828,#1d1410 70%);color:#fff1db;font-family:Tahoma,Arial,sans-serif;text-align:center}header{padding:22px}a{color:#a9e7b8}main{max-width:740px;margin:auto;padding:20px}h1{font-size:clamp(26px,5vw,44px)}.tabs,.board{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:22px auto}.btn,.tile{background:#3e2a1e;border:1px solid #947150;color:#fff4de;border-radius:14px;padding:15px 22px;font:inherit;cursor:pointer}.btn.active,.btn:hover{background:#267b4a}.tile{font-size:36px;min-width:85px;min-height:85px}.tile:disabled{opacity:.7}.panel{background:#ffffff0c;border:1px solid #ffffff22;border-radius:20px;padding:22px}#status{min-height:35px;font-weight:bold}#score{font-size:22px;color:#a7ecb4}input{padding:12px;border-radius:9px;font:inherit;max-width:100px;text-align:center}.board{direction:ltr}@media(max-width:500px){.tile{min-width:67px;min-height:70px;padding:10px}}</style></head><body><header><a href="./index.html">↩ الرجوع للمنيو</a></header><main><h1>🎮 PICK & OUT Arcade</h1><p>ألعاب للتسلية فقط — من غير حسابات أو نقاط ولاء أو مكافآت</p><div class="tabs"><button class="btn" data-game="memory">🧠 Memory</button><button class="btn" data-game="catch">☕ Catch</button><button class="btn" data-game="barista">⚡ Barista</button><button class="btn" data-game="guess">❓ Guess</button></div><div class="panel"><h2 id="gameTitle"></h2><p id="score"></p><p id="status"></p><div class="board" id="board"></div><button class="btn" id="restart">العب من جديد</button></div></main><script>const board=document.getElementById('board'),status=document.getElementById('status'),score=document.getElementById('score'),title=document.getElementById('gameTitle');let current='memory',turn=0,points=0,first=null,locked=false,round=0;const games={memory:'Coffee Memory',catch:'Catch the Coffee',barista:'Barista Rush',guess:'Guess the Drink'};function shuffle(a){return a.sort(()=>Math.random()-.5)}function button(label,fn){const b=document.createElement('button');b.className='tile';b.textContent=label;b.onclick=fn;board.appendChild(b);return b}function setGame(g){current=games[g]?g:'memory';turn++;points=0;round=0;first=null;locked=false;title.textContent=games[current];document.querySelectorAll('[data-game]').forEach(b=>b.classList.toggle('active',b.dataset.game===current));render()}function render(){board.innerHTML='';score.textContent='النتيجة: '+points;status.textContent='';if(current==='memory'){let cards=shuffle(['☕','🍩','🥤','🍰','☕','🍩','🥤','🍰'].map((v,i)=>({v,id:i})));let matched=0;cards.forEach(c=>{let b=button('❔',()=>{if(locked||b.disabled||b===first)return;b.textContent=c.v;if(!first){first=b;return}const previous=first;first=null;if(previous.textContent===b.textContent){previous.disabled=b.disabled=true;points++;matched+=2;score.textContent='الأزواج: '+points+'/4';if(matched===8)status.textContent='🎉 كسبت!'}else{locked=true;const t=turn;setTimeout(()=>{if(t!==turn)return;previous.textContent=b.textContent='❔';locked=false},650)}})})}else if(current==='catch'){status.textContent='اضغط على فنجان القهوة قبل ما مكانه يتغير';let target=Math.floor(Math.random()*9);for(let i=0;i<9;i++)button(i===target?'☕':'🪵',()=>{if(i===target){points++;score.textContent='النتيجة: '+points;render()}else{status.textContent='جرّب تاني!'}})}else if(current==='barista'){let target=['☕','🥤','🍵','🧋'][Math.floor(Math.random()*4)];status.textContent='حضّر المشروب: '+target;shuffle(['☕','🥤','🍵','🧋']).forEach(v=>button(v,()=>{if(v===target){points++;render()}else status.textContent='مش ده المشروب المطلوب، حاول تاني'}))}else{const drinks=[['لاتيه','🥛☕'],['شاي','🍵'],['عصير','🧃'],['دونات','🍩']];let selected=drinks[Math.floor(Math.random()*drinks.length)];status.textContent='خمن الاسم من الإيموجي: '+selected[1];shuffle(drinks.map(x=>x[0])).forEach(v=>button(v,()=>{if(v===selected[0]){points++;render()}else status.textContent='إجابة غلط، جرب تاني: '+selected[1]}))}}document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>setGame(b.dataset.game));document.getElementById('restart').onclick=()=>setGame(current);setGame(new URLSearchParams(location.search).get('game')||'memory');</script></body></html>
